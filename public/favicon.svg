<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#4f46e5"/>
  <!-- 3x3 grid lines -->
  <line x1="11" y1="4" x2="11" y2="28" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="21" y1="4" x2="21" y2="28" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="4" y1="11" x2="28" y2="11" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="4" y1="21" x2="28" y2="21" stroke="white" stroke-width="1" opacity="0.4"/>
  <!-- Box borders -->
  <rect x="4" y="4" width="24" height="24" rx="2" stroke="white" stroke-width="1.5" fill="none"/>
  <!-- Sample digits -->
  <text x="7" y="10" font-family="system-ui" font-size="6" fill="white" text-anchor="middle">9</text>
  <text x="16" y="10" font-family="system-ui" font-size="6" fill="white" text-anchor="middle">3</text>
  <text x="25" y="10" font-family="system-ui" font-size="6" fill="white" text-anchor="middle">5</text>
  <text x="7" y="20" font-family="system-ui" font-size="6" fill="white" text-anchor="middle">4</text>
  <text x="16" y="20" font-family="system-ui" font-size="6" fill="white" text-anchor="middle">7</text>
  <text x="25" y="20" font-family="system-ui" font-size="6" fill="white" text-anchor="middle">1</text>
  <text x="7" y="29" font-family="system-ui" font-size="6" fill="white" text-anchor="middle">2</text>
  <text x="16" y="29" font-family="system-ui" font-size="6" fill="white" text-anchor="middle">8</text>
  <text x="25" y="29" font-family="system-ui" font-size="6" fill="white" text-anchor="middle">6</text>
</svg>
